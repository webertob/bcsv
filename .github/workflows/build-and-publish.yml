name: Build and publish pybcsv wheels

on:
  push:
    branches: [ main, master, release ]
    tags:
      - 'v*'  # Trigger on version tags (v1.0.0, v1.0.1, etc.)
  pull_request:
    paths:
      - 'python/**'
      - 'include/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  CIBW_SKIP: "pp*"  # Skip PyPy builds

jobs:

  # Runs before anything is built so a version mismatch fails in seconds
  # rather than after the full wheel matrix.
  version-consistency:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - name: Check every version stamp against VERSION.txt
        run: |
          ARGS=()
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ARGS+=(--tag "${GITHUB_REF#refs/tags/}")
          fi
          python3 scripts/check_versions.py "${ARGS[@]}"

  # ── Build sdist ─────────────────────────────────────────────────────
  build-sdist:
    needs: version-consistency
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.13'

      - name: Sync headers for sdist
        run: python python/sync_headers.py --verbose

      - name: Build sdist
        run: |
          pip install build
          python -m build --sdist python/ --outdir dist/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: built-sdist
          path: dist/*.tar.gz

  # ── Build a wheel from the sdist ────────────────────────────────────
  # The wheel jobs below all build from the repository root, where CMake prefers
  # the parent include/ directory. That masks a stale python/include/ — the
  # bundled copy an sdist actually ships and a standalone build actually
  # compiles. A header change committed without re-syncing therefore produced a
  # green CI and an sdist that would not compile. This job is the only one that
  # compiles what we publish to PyPI as source.
  test-sdist:
    needs: build-sdist
    name: Build and test wheel from sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'

      - name: Download sdist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: built-sdist
          path: dist

      - name: Build a wheel from the sdist alone
        run: |
          set -e
          pip install build
          mkdir -p extracted
          tar xzf dist/*.tar.gz -C extracted --strip-components=1
          # Built from the extracted tree only: no parent include/ to fall back
          # on, so this compiles the bundled headers and CLI sources.
          python -m build --wheel extracted/ --outdir wheelhouse/

      - name: Install it and check it works
        run: |
          set -e
          pip install pytest numpy pyarrow
          pip install pybcsv --find-links wheelhouse/ --no-index
          python -c "
          import pybcsv
          print('version', pybcsv.__version__)
          print('default compression level', pybcsv.DEFAULT_COMPRESSION_LEVEL)
          "

      - name: Run the test suite against the sdist-built wheel
        # Run from outside the extracted tree: sitting in it puts its pybcsv/
        # source directory ahead of the installed wheel on sys.path, and the
        # source directory has no compiled extension, so every test errors on
        # import and the wheel never gets exercised.
        working-directory: /tmp
        run: python -m pytest "$GITHUB_WORKSPACE/extracted/tests" -q

  # ── Build Linux wheels ──────────────────────────────────────────────
  build-linux:
    needs: version-consistency
    name: Build Linux wheels (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm    # Native ARM64 runner (no QEMU)
            arch: aarch64
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.13'

      - name: Install cibuildwheel
        run: pip install cibuildwheel==2.22.0 uv

      - name: Build wheels
        env:
          CIBW_ARCHS_LINUX: ${{ matrix.arch }}
          CIBW_BUILD_FRONTEND: "build[uv]"
        run: python -m cibuildwheel python --output-dir dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: built-wheels-linux-${{ matrix.arch }}
          path: dist/*.whl

  # ── Build Windows wheels ────────────────────────────────────────────
  build-windows:
    needs: version-consistency
    name: Build Windows wheels (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [AMD64]  # Add x86, ARM64 for releases when needed
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.13'

      - name: Install cibuildwheel
        run: pip install cibuildwheel==2.22.0 uv

      - name: Build wheels
        env:
          CIBW_ARCHS_WINDOWS: ${{ matrix.arch }}
          CIBW_BUILD_FRONTEND: "build[uv]"
        run: python -m cibuildwheel python --output-dir dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: built-wheels-windows-${{ matrix.arch }}
          path: dist/*.whl

  # ── Build macOS wheels ──────────────────────────────────────────────
  build-macos:
    needs: version-consistency
    name: Build macOS wheels (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15      # Cross-compile x86_64 on Apple Silicon
            arch: x86_64
          - os: macos-15      # Apple Silicon arm64 (Xcode 16.4 / Apple Clang 16)
            arch: arm64
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.13'

      - name: Install cibuildwheel
        run: pip install cibuildwheel==2.22.0 uv

      - name: Build wheels
        env:
          CIBW_ARCHS_MACOS: ${{ matrix.arch }}
          CIBW_BUILD_FRONTEND: "build[uv]"
          MACOSX_DEPLOYMENT_TARGET: "13.3"
        run: python -m cibuildwheel python --output-dir dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: built-wheels-macos-${{ matrix.arch }}
          path: dist/*.whl

  # ── Test built wheel ────────────────────────────────────────────────
  test-wheel:
    name: Test wheel (${{ matrix.name }})
    needs: [build-linux, build-windows, build-macos]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            artifact: built-wheels-linux-x86_64
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            artifact: built-wheels-linux-aarch64
          - name: Windows AMD64
            os: windows-latest
            artifact: built-wheels-windows-AMD64
          - name: macOS ARM64
            os: macos-15
            artifact: built-wheels-macos-arm64
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'

      - name: Download wheel
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ matrix.artifact }}
          path: dist

      - name: Install wheel and test dependencies
        run: |
          pip install pytest pandas numpy pyarrow
          pip install pybcsv --find-links dist/ --no-index

      - name: Verify the installed wheel reports the expected version
        shell: bash
        run: |
          set -e
          # On a tag build the wheel version, the compiled extension and
          # VERSION.txt must all agree. setuptools_scm derives wheel metadata
          # from the tag while the native extension takes VERSION.txt, so this
          # is the seam where the two could diverge.
          EXPECTED="$(cat VERSION.txt)"
          python - "$EXPECTED" "$GITHUB_REF" <<'PYCHECK'
          import sys
          import pybcsv

          expected, ref = sys.argv[1], sys.argv[2]
          found = pybcsv.__version__
          print(f"VERSION.txt={expected}  pybcsv.__version__={found}")
          if ref.startswith("refs/tags/v"):
              if found != expected:
                  sys.exit(
                      f"FAIL wheel reports {found!r} but VERSION.txt says {expected!r}"
                  )
              print("PASS wheel version matches VERSION.txt")
          else:
              # Untagged builds carry a setuptools_scm dev suffix; only the
              # release line has to match exactly.
              print("skipped exact match (not a tag build)")
          PYCHECK

      - name: Run pybcsv test suite
        run: python -m pytest python/tests/ -v --tb=short

  # ── Publish to PyPI (Trusted Publisher / OIDC) ──────────────────────
  publish-testpypi:
    name: Publish to TestPyPI
    needs: [build-sdist, test-sdist, build-linux, build-windows, build-macos, test-wheel]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    environment: testpypi
    permissions:
      id-token: write  # Required for trusted publishing
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist-artifacts
          pattern: built-*
          merge-multiple: false

      - name: Collect all distributions
        run: |
          mkdir -p dist
          find dist-artifacts -name "*.whl" -o -name "*.tar.gz" | xargs -I{} cp {} dist/
          echo "=== Distributions to upload ==="
          ls -lh dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI
    needs: [build-sdist, test-sdist, build-linux, build-windows, build-macos, test-wheel]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write  # Required for trusted publishing
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist-artifacts
          pattern: built-*
          merge-multiple: false

      - name: Collect all distributions
        run: |
          mkdir -p dist
          find dist-artifacts -name "*.whl" -o -name "*.tar.gz" | xargs -I{} cp {} dist/
          echo "=== Distributions to upload ==="
          ls -lh dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          skip-existing: true

  # ── Post-publish smoke test ─────────────────────────────────────────
  smoke-test:
    name: Smoke test from TestPyPI
    needs: [publish-testpypi]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Install from TestPyPI and test
        run: |
          python -m venv /tmp/smoke
          source /tmp/smoke/bin/activate
          pip install --upgrade pip
          # Install numpy, pandas, pyarrow from PyPI first (not available on TestPyPI)
          pip install numpy pandas pyarrow
          # Install pybcsv from TestPyPI (--pre for dev/pre-release versions from non-tag pushes)
          pip install --pre --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ pybcsv
          python -c "
          import pybcsv
          print(f'pybcsv {pybcsv.__version__} imported successfully')
          # Basic functionality check
          layout = pybcsv.Layout()
          layout.add_column('x', pybcsv.ColumnType.DOUBLE)
          layout.add_column('s', pybcsv.ColumnType.STRING)
          print(f'Layout: {layout.column_count()} columns')
          # Arrow interop check
          import tempfile, os
          path = os.path.join(tempfile.mkdtemp(), 'smoke.bcsv')
          w = pybcsv.Writer(layout)
          w.open(path)
          w.write_row([3.14, 'hello'])
          w.close()
          table = pybcsv.read_to_arrow(path)
          assert len(table) == 1
          os.unlink(path)
          print('Smoke test PASSED (core + Arrow)')
          "
