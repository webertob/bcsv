# Multi-platform build & test workflow.
# Ensures BCSV compiles with zero warnings and all tests pass on:
#   Linux (GCC + Clang), Windows (MSVC), macOS (Apple Clang)
# Also gates the Python bindings and the cross-package version stamps -- keep
# the `paths:` filters below in step with the jobs, or a job silently
# stops running for the changes it exists to guard.

name: CI

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'include/**'
      - 'src/**'
      - 'tests/**'
      - 'benchmark/**'
      - 'examples/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - '.github/workflows/ci.yml'
      # The pybcsv job below gates Python changes; without these a
      # Python-only PR skips the whole workflow and the gate never runs.
      - 'python/**'
      # The version-consistency job guards these manifests against drift
      # (python/VERSION.txt once sat three releases stale while the check
      # reported PASS). A PR touching only one of them must still run it.
      - 'VERSION.txt'
      - 'scripts/check_versions.py'
      - 'unity/package.json'
      - 'csharp/src/Bcsv/Bcsv.csproj'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'include/**'
      - 'src/**'
      - 'tests/**'
      - 'benchmark/**'
      - 'examples/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - '.github/workflows/ci.yml'
      # The pybcsv job below gates Python changes; without these a
      # Python-only PR skips the whole workflow and the gate never runs.
      - 'python/**'
      # The version-consistency job guards these manifests against drift
      # (python/VERSION.txt once sat three releases stale while the check
      # reported PASS). A PR touching only one of them must still run it.
      - 'VERSION.txt'
      - 'scripts/check_versions.py'
      - 'unity/package.json'
      - 'csharp/src/Bcsv/Bcsv.csproj'
  schedule:
    - cron: '0 3 * * 1'   # Weekly Monday 3 AM UTC — Release builds
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # Cheap guard that runs on every push: the committed manifests are patched
  # from VERSION.txt only at pack time, so nothing else notices when they
  # drift. unity/package.json sat at 1.5.3 for nine releases before this.
  version-consistency:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - name: Check every version stamp against VERSION.txt
        run: python3 scripts/check_versions.py

  # ────────────────────────────────────────────────────────────────
  # pybcsv — every push / PR
  #
  # python/tests/ is NOT registered with ctest (only tests/integration/*.py
  # is), so without this job the entire Python suite -- including the Parquet
  # transcoders -- ran only in the tag-driven publish workflow. A regression
  # then landed on master and surfaced mid-release. See VERSIONING.md on
  # lock step: the channel that changes most often needs a per-PR gate.
  # ────────────────────────────────────────────────────────────────
  pybcsv:
    name: pybcsv (Python bindings + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # setuptools-scm derives the wheel version from tags; a shallow
          # clone hides them (see VERSIONING.md, Troubleshooting).
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'

      - name: Install build and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pandas numpy pyarrow polars

      - name: Build and install pybcsv
        run: python -m pip install ./python -v

      - name: Run the pybcsv test suite
        run: python -m pytest python/tests/ -v --tb=short

  # ────────────────────────────────────────────────────────────────
  # Debug builds — every push / PR
  # ────────────────────────────────────────────────────────────────
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            os: ubuntu-latest
            compiler: gcc
            configure-preset: ninja-debug
            build-preset: ninja-debug-build
            build-dir: build/ninja-debug

          - name: Linux Clang
            os: ubuntu-latest
            compiler: clang
            configure-preset: clang-debug
            build-preset: clang-debug-build
            build-dir: build/clang-debug

          # Ninja rather than the "Visual Studio 17 2022" generator presets:
          # windows-latest no longer ships VS 2022, so those presets fail at
          # configure with "could not find any instance of Visual Studio".
          # msvc-dev-cmd (below) puts cl.exe on PATH, which is all Ninja needs,
          # and this stops CI depending on a specific VS major version.
          # These presets are single-config, so no cmake-config is required.
          - name: Windows MSVC
            os: windows-latest
            compiler: msvc
            configure-preset: ninja-msvc-debug
            build-preset: ninja-msvc-debug-build
            build-dir: build/ninja-msvc-debug

          - name: macOS Apple Clang
            os: macos-latest
            compiler: apple-clang
            configure-preset: ninja-debug
            build-preset: ninja-debug-build
            build-dir: build/ninja-debug

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q ninja-build

      - name: Install Clang (Linux)
        if: matrix.compiler == 'clang'
        run: sudo apt-get install -y -q clang

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      # The Windows matrix entries use the Ninja MSVC presets (see the note
      # there). Ninja ships with some runner images and not others, so install
      # it rather than depend on the image.
      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y --no-progress

      - name: Setup MSVC
        if: matrix.compiler == 'msvc'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'

      - name: Cache CMake dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ${{ matrix.build-dir }}/_deps
          key: deps-${{ matrix.os }}-${{ matrix.compiler }}-${{ hashFiles('**/**/CMakeLists.txt') }}

      - name: Configure
        run: cmake --preset ${{ matrix.configure-preset }} -DPython3_ROOT_DIR="${{ env.pythonLocation }}"

      - name: Build
        run: cmake --build --preset ${{ matrix.build-preset }} --parallel

      - name: Install pytest
        run: python -m pip install pytest

      - name: Test
        run: >-
          ctest --test-dir ${{ matrix.build-dir }}
          --output-on-failure
          ${{ matrix.cmake-config && format('-C {0}', matrix.cmake-config) || '' }}

  # ────────────────────────────────────────────────────────────────
  # Release builds — weekly schedule + manual dispatch
  # ────────────────────────────────────────────────────────────────
  release-build:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC (Release)
            os: ubuntu-latest
            compiler: gcc
            configure-preset: ninja-release
            build-preset: ninja-release-build
            build-dir: build/ninja-release

          - name: Linux Clang (Release)
            os: ubuntu-latest
            compiler: clang
            configure-preset: clang-release
            build-preset: clang-release-build
            build-dir: build/clang-release

          # See the Windows MSVC note in the debug matrix above.
          - name: Windows MSVC (Release)
            os: windows-latest
            compiler: msvc
            configure-preset: ninja-msvc-release
            build-preset: ninja-msvc-release-build
            build-dir: build/ninja-msvc-release

          - name: macOS Apple Clang (Release)
            os: macos-latest
            compiler: apple-clang
            configure-preset: ninja-release
            build-preset: ninja-release-build
            build-dir: build/ninja-release

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q ninja-build

      - name: Install Clang (Linux)
        if: matrix.compiler == 'clang'
        run: sudo apt-get install -y -q clang

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      # The Windows matrix entries use the Ninja MSVC presets (see the note
      # there). Ninja ships with some runner images and not others, so install
      # it rather than depend on the image.
      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y --no-progress

      - name: Setup MSVC
        if: matrix.compiler == 'msvc'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'

      - name: Cache CMake dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ${{ matrix.build-dir }}/_deps
          key: deps-${{ matrix.os }}-${{ matrix.compiler }}-release-${{ hashFiles('**/**/CMakeLists.txt') }}

      - name: Configure
        run: cmake --preset ${{ matrix.configure-preset }} -DPython3_ROOT_DIR="${{ env.pythonLocation }}"

      - name: Build
        run: cmake --build --preset ${{ matrix.build-preset }} --parallel

      - name: Install pytest
        run: python -m pip install pytest

      - name: Test
        run: >-
          ctest --test-dir ${{ matrix.build-dir }}
          --output-on-failure
          ${{ matrix.cmake-config && format('-C {0}', matrix.cmake-config) || '' }}
