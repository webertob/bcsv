# THE SINGLE PUBLISHER — hub of the hub-and-spoke release pipeline
# (docs/CI_CD_REDESIGN.md).
#
# The three packagers (build-and-publish.yml "wheels", csharp-nuget.yml,
# unity-package.yml) build, test and ARCHIVE only. This hub runs a `gate`
# job first: it polls the packagers' TAG runs for this commit until every
# one concludes success, and refuses to ship otherwise. Only then does it
# download their archived artifacts across runs and publish every channel
# together — GitHub Release, PyPI, NuGet (both feeds) — and let
# upm-branch.yml follow.
#
# Why a hub and not a per-packager gate: cross-workflow `needs:` does not
# exist, and poll-gates inside each packager's publish job deadlock (each
# waits on a sibling run that cannot finish while its own gate polls back).
# One gate, zero cycles.
#
# A ship now fails atomically: one red sibling leaves every channel
# untouched — the defect of v1.5.20 (PyPI shipped, NuGet/Unity died) cannot
# recur, and with it the double-release dance that syncs version numbers.

name: Release Ship

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on version tags like v1.0.4, v2.1.0, etc.

permissions:
  contents: write

jobs:
  # ── Ship gate: the whole fleet must be green before anything ships ──
  gate:
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    timeout-minutes: 160
    permissions:
      contents: read
      actions: read
    outputs:
      unity_run_id: ${{ steps.wait.outputs.unity_run_id }}
      nuget_run_id: ${{ steps.wait.outputs.nuget_run_id }}
      wheels_run_id: ${{ steps.wait.outputs.wheels_run_id }}
    steps:
      - name: Wait for every packager tag run to turn green
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -uo pipefail
          # Poll the SIBLINGS only — never this workflow, never this run: a
          # gate watching its own workflow self-deadlocks. Files, not display
          # names: file names cannot collide with a renamed workflow.
          SIBLINGS="unity-package.yml csharp-nuget.yml build-and-publish.yml"
          INTERVAL=120   # seconds between polls
          DEADLINE=$(( $(date +%s) + 150 * 60 ))   # 150 min total cap

          declare -A RUN_ID   # workflow file -> run id (once concluded)

          poll() {
            local file="$1"
            # Tag-push and master-push runs of the same sha both report
            # event: push — head_branch == tag is what disambiguates.
            # An absent run = still queued = keep polling, not a failure.
            gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/$file/runs?head_sha=$GITHUB_SHA&per_page=100" \
              --jq ".workflow_runs[]
                    | select(.event == \"push\" and .head_branch == \"$TAG\")
                    | \"\(.status)\t\(.conclusion // \"\")\t\(.databaseId // .id)\"" \
              | sort -r | head -1
          }

          while :; do
            all_done=true
            for file in $SIBLINGS; do
              # Skip siblings already concluded green (id recorded).
              [ -n "${RUN_ID[$file]+x}" ] && continue

              line=$(poll "$file" || true)
              status=${line%%	*}
              rest=${line#*	}; conclusion=${rest%%	*}; rid=${rest##*	}

              if [ -z "$line" ]; then
                all_done=false                       # not queued/started yet
              elif [ "$status" != "completed" ]; then
                all_done=false                       # still in progress
              elif [ "$conclusion" != "success" ]; then
                echo "::error::$file run $rid for $TAG concluded '$conclusion' — refusing to ship $TAG on any channel."
                exit 1
              else
                RUN_ID[$file]="$rid"
                echo "$file green (run $rid)"
              fi
            done

            if $all_done; then break; fi
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "::error::Packager runs did not all conclude within 150 minutes — refusing to ship."
              exit 1
            fi
            sleep "$INTERVAL"
          done

          echo "unity_run_id=${RUN_ID[unity-package.yml]}"  >> "$GITHUB_OUTPUT"
          echo "nuget_run_id=${RUN_ID[csharp-nuget.yml]}"   >> "$GITHUB_OUTPUT"
          echo "wheels_run_id=${RUN_ID[build-and-publish.yml]}" >> "$GITHUB_OUTPUT"
          echo "All packagers green for $TAG — shipping."

  release:
    needs: gate
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read   # gh run download of the packagers' archived artifacts

    steps:
    - name: Checkout repository
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      with:
        fetch-depth: 0

    - name: Fetch the Unity .tgz from its green tag run
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # Cross-run download: the packager archived the .tgz as the
        # `unity-package` artifact (30-day retention); the gate verified that
        # run concluded success before this job was allowed to start.
        # -R: gh derives the repo from the git context otherwise; pass it
        # explicitly so no job depends on a checkout being present.
        gh run download "${{ needs.gate.outputs.unity_run_id }}" \
          -R "$GITHUB_REPOSITORY" \
          --pattern unity-package --dir release-assets
        # gh nests each artifact under a subdir of its name; flatten one
        # level with a plain glob loop — the runner's find rejects the
        # '-exec {…} dest +' form (observed in CI, attempt 3) and -exec has
        # no business being in the ship path at all.
        for f in release-assets/*/*.tgz; do
          if [ -e "$f" ]; then mv "$f" release-assets/; fi
        done
        # Hard guard: action-gh-release silently skips globs that match
        # nothing (that is how v1.5.20 shipped without its .tgz). Fail here
        # instead, while a retag is cheap.
        ls release-assets/com.bcsv.unity-*.tgz >/dev/null
    
    - name: Extract version from tag
      id: version
      run: |
        # Extract version from tag (remove 'v' prefix)
        TAG_NAME=${GITHUB_REF#refs/tags/}
        VERSION=${TAG_NAME#v}
        
        # Validate version format (X.Y.Z)
        if [[ ! $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Error: Invalid version format '$VERSION'. Expected format: X.Y.Z"
          exit 1
        fi
        
        # Split version into components
        IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
        
        echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "major=$MAJOR" >> $GITHUB_OUTPUT
        echo "minor=$MINOR" >> $GITHUB_OUTPUT
        echo "patch=$PATCH" >> $GITHUB_OUTPUT
        
        echo "Extracted version: $VERSION (Major: $MAJOR, Minor: $MINOR, Patch: $PATCH)"
    
    - name: Verify VERSION.txt matches the tag
      run: |
        # VERSION.txt is the single source of truth and must be bumped in a
        # commit before the tag is pushed. Failing here is the intended
        # outcome when that step was skipped: it stops a release from going
        # out stamped with the previous version.
        python3 scripts/check_versions.py --tag "${{ steps.version.outputs.tag_name }}"

    - name: Generate version_generated.h for the include artifact
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        MAJOR="${{ steps.version.outputs.major }}"
        MINOR="${{ steps.version.outputs.minor }}"
        PATCH="${{ steps.version.outputs.patch }}"

        # The header is gitignored - CMake generates it into the build tree -
        # so the header-only zip needs its own copy written here.
        {
          echo '// Auto-generated version header - DO NOT EDIT MANUALLY'
          echo '// This file is generated by GitHub Actions from VERSION.txt'
          echo ''
          echo '#ifndef BCSV_VERSION_GENERATED_H'
          echo '#define BCSV_VERSION_GENERATED_H'
          echo ''
          echo 'namespace bcsv {'
          echo 'namespace version {'
          echo ''
          echo "constexpr int MAJOR = ${MAJOR};"
          echo "constexpr int MINOR = ${MINOR};"
          echo "constexpr int PATCH = ${PATCH};"
          echo "constexpr const char* STRING = \"${VERSION}\";"
          echo ''
          echo '} // namespace version'
          echo '} // namespace bcsv'
          echo ''
          echo '#endif // BCSV_VERSION_GENERATED_H'
        } > include/bcsv/version_generated.h

        echo "Generated version_generated.h for version $VERSION"

    - name: Validate generated version
      run: |
        # Verify the header file was generated correctly
        if grep -q "constexpr int MAJOR = ${{ steps.version.outputs.major }};" include/bcsv/version_generated.h; then
          echo "✓ Version header generated successfully"
        else
          echo "✗ Failed to generate version header"
          exit 1
        fi

    - name: Prepare include artifact
      id: artifact
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        STAGE_DIR=$(mktemp -d)
        cp -R include "$STAGE_DIR/include"
        ZIP_PATH="$RUNNER_TEMP/bcsv-include-v${VERSION}.zip"
        (cd "$STAGE_DIR" && zip -r "$ZIP_PATH" include)
        echo "zip_path=$ZIP_PATH" >> $GITHUB_OUTPUT

    - name: Create Release
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
      with:
        tag_name: ${{ steps.version.outputs.tag_name }}
        name: Release ${{ steps.version.outputs.tag_name }}
        # The header zip is built here; the Unity .tgz was fetched from the
        # green Unity Package tag run — previously unity-package.yml attached
        # it itself, which is how v1.5.20's release went out without it.
        files: |
          ${{ steps.artifact.outputs.zip_path }}
          release-assets/com.bcsv.unity-*.tgz
        # Emergency retag survivability, same logic as skip-existing on the
        # registries: a re-ship re-attaches rather than dying on the name
        # that a previous attempt already uploaded.
        overwrite_files: true
        generate_release_notes: true
        body: |
          ## BCSV Release ${{ steps.version.outputs.version }}
          
          This release embeds version metadata matching the git tag.
          
          ### Changes in this release:
          - Version metadata generated from tag `${{ steps.version.outputs.tag_name }}`
          - Header-only include artifact attached for direct consumption
          
          ### For developers:
          This release workflow is tag-driven and does not mutate repository branches.
          The attached include artifact provides deterministic header-only distribution.
          
          ### Usage:
          Download the attached `bcsv-include-v*.zip` and use BCSV as a header-only library.
          The version information is embedded and accessible via:
          ```cpp
          #include "bcsv/definitions.h"
          std::cout << "BCSV Version: " << bcsv::getVersion() << std::endl;
          ```
        draft: false
        prerelease: false
    
    - name: Summary
      run: |
        echo "🎉 Release workflow completed successfully!"
        echo "📦 Release ${{ steps.version.outputs.tag_name }} created"
        echo "📝 Version metadata generated for ${{ steps.version.outputs.version }}"
        echo "✅ Header-only include artifact attached to release"
        echo "✅ Unity .tgz attached from green run ${{ needs.gate.outputs.unity_run_id }}"

  # ── Publish PyPI from the wheels spoke's green tag run ───────────────
  publish-pypi:
    name: Publish to PyPI
    needs: [gate, release]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      actions: read   # gh run download
      id-token: write # Required for trusted publishing
    steps:      
      - name: Download wheels & sdist from the green tag run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "${{ needs.gate.outputs.wheels_run_id }}" \
            -R "$GITHUB_REPOSITORY" \
            --pattern "built-*" --dir dist-artifacts
          mkdir dist
          # Copy across the artifacts' subdirs; the -e guard skips a glob
          # that matches nothing (no *.whl in the sdist dir, no *.tar.gz
          # in a wheel dir). Glob loops, not find -exec: the runner's find
          # rejects '-exec {…} dest +'.
          for f in dist-artifacts/*/*.whl dist-artifacts/*/*.tar.gz; do
            if [ -e "$f" ]; then cp "$f" dist/; fi
          done
          echo "=== Distributions to publish ==="
          ls -lh dist/

      - name: Publish to PyPI
        # skip-existing keeps an emergency retag survivable — the lesson of
        # 1.5.20 → 1.5.21: re-running a ship must not die on the files that
        # already landed while the failed channels catch up.
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          skip-existing: true

  # ── Publish NuGet (both feeds) from the C# spoke's green tag run ─────
  publish-nuget-gh:
    name: Publish to GitHub Packages
    needs: [gate, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # gh run download
      packages: write
    steps:
      - name: Download .nupkg from the green tag run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # No checkout in this job: -R gives gh the repo without a git
          # context. Flatten the gh artifact subdir so *.nupkg matches.
          gh run download "${{ needs.gate.outputs.nuget_run_id }}" \
            -R "$GITHUB_REPOSITORY" \
            --pattern nuget-package --dir nupkg
          for f in nupkg/*/*.nupkg; do
            if [ -e "$f" ]; then mv "$f" nupkg/; fi
          done
          ls -lh nupkg/

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'

      - name: Push to GitHub Packages
        run: |
          dotnet nuget push nupkg/*.nupkg \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --skip-duplicate

  publish-nuget-org:
    name: Publish to NuGet.org
    needs: [gate, release]
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      actions: read # gh run download
    steps:
      - name: Download .nupkg from the green tag run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ needs.gate.outputs.nuget_run_id }}" \
            -R "$GITHUB_REPOSITORY" \
            --pattern nuget-package --dir nupkg
          for f in nupkg/*/*.nupkg; do
            if [ -e "$f" ]; then mv "$f" nupkg/; fi
          done
          ls -lh nupkg/

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'

      - name: Push to NuGet.org
        run: |
          dotnet nuget push nupkg/*.nupkg \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate