# Benchmarks are expensive wall time, and their number only means something
# for a tree we are about to ship: they run on version tags (the release
# sweep, whose success the Release workflow also gates on) and on manual
# dispatch. A quick perf pulse during development stays local — the same
# MACRO-SMALL sweep is `python3 benchmark/run.py wip --type=MACRO-SMALL`.

name: Benchmark Suite

on:
  push:
    tags:
      - 'v*.[0-9]*.[0-9]*'   # release tags only — never the UPM '*-upm' tags
  workflow_dispatch:
    inputs:
      type:
        description: 'Run type(s): MICRO, MACRO-SMALL, MACRO-LARGE (comma-separated)'
        required: false
        default: 'MACRO-SMALL'
      repetitions:
        description: 'Repetitions per type'
        required: false
        default: '1'

permissions:
  contents: read

env:
  BUILD_TYPE: Release
  CXX_FLAGS: "-O3"

jobs:
  # ──────────────────────────────────────────────────────────────────
  # Full benchmark on release tags (L size, ~2 minutes)
  # ──────────────────────────────────────────────────────────────────
  benchmark-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - name: Checkout release
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      with:
        fetch-depth: 0

    - name: Install dependencies
      run: |
        sudo apt-get update -q
        sudo apt-get install -y -q ninja-build python3-matplotlib python3-pytest

    - name: Configure CMake (Release)
      run: |
        cmake -S . -B build \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DCMAKE_CXX_FLAGS="${{ env.CXX_FLAGS }}" \
          -DBCSV_BUILD_BENCHMARKS=ON \
          -DBCSV_BUILD_MICRO_BENCHMARKS=ON \
          -DBCSV_ENABLE_EXTERNAL_CSV_BENCH=ON

    - name: Build benchmarks
      run: cmake --build build --target bench_macro_datasets bench_micro_types bench_generate_csv -j$(nproc)

    - name: Build CLI tools
      run: cmake --build build --target csv2bcsv bcsv2csv -j$(nproc)

    - name: Build core tests
      run: cmake --build build --target bcsv_gtest test_c_api test_row_api -j$(nproc)

    - name: Run core tests
      run: ctest --test-dir build --output-on-failure -R "test_row_api|test_c_api$|BCSVTestSuite"

    - name: Run release benchmark sweep
      run: |
        RUN_ROOT="${{ runner.temp }}/bench_results/release-${{ github.ref_name }}"
        python3 benchmark/run.py wip \
          --type=MICRO,MACRO-SMALL \
          --repetitions=1 \
          --build-type=Release \
          --git=${{ github.ref_name }} \
          --results="$RUN_ROOT" \
          --no-build

    - name: Resolve run directory
      id: resolve_release
      run: |
        RUN_ROOT="${{ runner.temp }}/bench_results/release-${{ github.ref_name }}"
        RUN_DIR=$(ls -1dt "$RUN_ROOT"/* | head -1)
        echo "run_dir=$RUN_DIR" >> "$GITHUB_OUTPUT"

    - name: Upload benchmark results
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: benchmark-results-${{ github.ref_name }}
        path: |
          ${{ steps.resolve_release.outputs.run_dir }}
        retention-days: 90

    - name: Post release summary
      run: |
        REPORT="${{ steps.resolve_release.outputs.run_dir }}/report.md"
        if [ -f "$REPORT" ]; then
          echo "## Benchmark Results — ${{ github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
        fi

  # ──────────────────────────────────────────────────────────────────
  # Manual dispatch — configurable size and mode
  # ──────────────────────────────────────────────────────────────────
  benchmark-manual:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Checkout
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      with:
        fetch-depth: 0

    - name: Install dependencies
      run: |
        sudo apt-get update -q
        sudo apt-get install -y -q ninja-build python3-matplotlib python3-pytest

    - name: Configure CMake (Release)
      run: |
        cmake -S . -B build \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DCMAKE_CXX_FLAGS="${{ env.CXX_FLAGS }}" \
          -DBCSV_BUILD_BENCHMARKS=ON \
          -DBCSV_BUILD_MICRO_BENCHMARKS=ON \
          -DBCSV_ENABLE_EXTERNAL_CSV_BENCH=ON

    - name: Build all benchmarks
      run: cmake --build build -j$(nproc)

    - name: Run core tests
      run: ctest --test-dir build --output-on-failure

    - name: Run benchmarks (${{ inputs.type }})
      env:
        BENCH_TYPE: ${{ inputs.type }}
        BENCH_REPS: ${{ inputs.repetitions }}
      run: |
        RUN_ROOT="${{ runner.temp }}/bench_results/manual"
        python3 benchmark/run.py wip \
          --type="$BENCH_TYPE" \
          --repetitions="$BENCH_REPS" \
          --build-type=Release \
          --git=manual \
          --results="$RUN_ROOT" \
          --no-build

    - name: Resolve run directory
      id: resolve_manual
      run: |
        RUN_ROOT="${{ runner.temp }}/bench_results/manual"
        RUN_DIR=$(ls -1dt "$RUN_ROOT"/* | head -1)
        echo "run_dir=$RUN_DIR" >> "$GITHUB_OUTPUT"

    - name: Upload results
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: benchmark-results-manual
        path: |
          ${{ steps.resolve_manual.outputs.run_dir }}
        retention-days: 90

    - name: Post summary
      run: |
        REPORT="${{ steps.resolve_manual.outputs.run_dir }}/report.md"
        if [ -f "$REPORT" ]; then
          echo "## Benchmark (${{ inputs.type }})" >> "$GITHUB_STEP_SUMMARY"
          cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
        fi
