# Build multi-platform native libraries and pack a Unity Package Manager (.tgz)
# Produces native bcsv_c_api binaries for:
#   win-x64, linux-x64, linux-arm64, osx-arm64
# Then packs unity/ into a UPM-compatible .tgz tarball.

name: Unity Package

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
    paths:
      - 'unity/**'
      - 'include/**'
      - 'src/bcsv_c_api.cpp'
      - 'CMakeLists.txt'
      # The packing scripts decide what ships and whether it is fit to ship,
      # so a change to either has to be exercised like a change to unity/.
      - 'scripts/pack-unity.sh'
      - 'scripts/check-unity-package.sh'
      - 'scripts/run-unity-tests.sh'
      - '.github/workflows/unity-package.yml'
  pull_request:
    paths:
      - 'unity/**'
      - 'include/**'
      - 'src/bcsv_c_api.cpp'
      - 'CMakeLists.txt'
      - 'scripts/pack-unity.sh'
      - 'scripts/check-unity-package.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Build native shared library per platform ────────────────────────
  build-native:
    name: Native ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built inside manylinux, not on the runner. A library built on
          # ubuntu-latest carries that runner's glibc (2.39) and will not load
          # on anything older, which for a package people install into their own
          # projects is the whole ballgame. manylinux_2_28 is the same image
          # pybcsv already builds its wheels in - see python/pyproject.toml - so
          # it is known to compile this C++20 codebase; its GCC is 14.2.
          - rid: linux-x64
            os: ubuntu-latest
            container: quay.io/pypa/manylinux_2_28_x86_64
            lib-name: libbcsv_c_api.so
            lib-dir: build

          - rid: linux-arm64
            os: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
            lib-name: libbcsv_c_api.so
            lib-dir: build

          - rid: win-x64
            os: windows-latest
            lib-name: bcsv_c_api.dll
            lib-dir: build/bin

          - rid: osx-arm64
            os: macos-15
            lib-name: libbcsv_c_api.dylib
            lib-dir: build

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # Tags are needed so the build can verify VERSION.txt against the
          # tag it claims to be. The default shallow fetch hides them.
          fetch-depth: 0

      - name: Trust the workspace (Linux containers)
        if: matrix.container != ''
        run: |
          # These jobs run in a container while the workspace is created by the
          # runner, so git sees a directory owned by someone else and refuses:
          # "detected dubious ownership". Every git call then fails, and before
          # BCSV_STRICT_VERSION existed the build quietly fell back to a stale
          # VERSION.txt - that is how v1.5.12 shipped Linux natives stamped
          # 1.5.11 while Windows, which runs on the bare runner, was correct.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" describe --tags --always

      - name: Install CMake and Ninja (Linux)
        if: runner.os == 'Linux'
        run: |
          # The manylinux image ships neither, and its distro cmake predates
          # what this project needs. pip carries both as wheels.
          /opt/python/cp311-cp311/bin/pip install --quiet cmake ninja
          echo "/opt/python/cp311-cp311/bin" >> "$GITHUB_PATH"

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Cache CMake dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: build/_deps
          key: unity-native-deps-${{ matrix.rid }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure & Build (Unix)
        if: runner.os != 'Windows'
        run: |
          # The C++ runtime is linked statically on Linux so the artifact does
          # not need a matching libstdc++ on the target - built here with GCC 14
          # it would otherwise demand GLIBCXX_3.4.32, far above the glibc floor.
          # macOS neither needs that nor allows it: libc++ is part of the system
          # and AppleClang rejects -static-libgcc outright.
          EXTRA=()
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            EXTRA+=(-DCMAKE_SHARED_LINKER_FLAGS="-static-libstdc++ -static-libgcc")
          fi

          cmake -G Ninja -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBCSV_WERROR=ON \
            -DBCSV_STRICT_VERSION=ON \
            -DBUILD_TESTS=OFF \
            -DBUILD_BENCHMARKS=OFF \
            -DBUILD_TOOLS=OFF \
            -DBUILD_EXAMPLES=OFF \
            "${EXTRA[@]}"
          cmake --build build --target bcsv_c_api --parallel

      - name: Configure & Build (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -G Ninja -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DBCSV_WERROR=ON `
            -DBCSV_STRICT_VERSION=ON `
            -DBUILD_TESTS=OFF `
            -DBUILD_BENCHMARKS=OFF `
            -DBUILD_TOOLS=OFF `
            -DBUILD_EXAMPLES=OFF `
            -DCMAKE_POLICY_DEFAULT_CMP0091=NEW `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          cmake --build build --target bcsv_c_api --parallel

      - name: Verify the library loads and needs no extra runtime
        shell: bash
        run: |
          set -e
          LIB="${{ matrix.lib-dir }}/${{ matrix.lib-name }}"
          echo "=== $LIB ==="

          if [[ "${{ runner.os }}" == "Linux" ]]; then
            objdump -p "$LIB" | awk '/NEEDED/ {print "  needs " $2}'
            if objdump -p "$LIB" | grep -qE 'NEEDED.*(libstdc\+\+|libgcc_s)'; then
              echo "  FAIL links the C++ runtime dynamically; the target would need a"
              echo "       matching libstdc++, which the build container hides here"
              exit 1
            fi
            # A version scan alone is not enough: it only sees versioned
            # symbols, and an unresolved C++ ABI symbol or an unversioned libc
            # entry point such as copy_file_range is invisible to it. Loading
            # the library is the only check that covers those.
            cp "$LIB" /tmp/lib.so
            /opt/python/cp311-cp311/bin/python - <<'PY'
          import ctypes
          lib = ctypes.CDLL("/tmp/lib.so")
          lib.bcsv_layout_create.restype = ctypes.c_void_p
          lib.bcsv_layout_destroy.argtypes = [ctypes.c_void_p]
          h = lib.bcsv_layout_create()
          assert h, "bcsv_layout_create returned null"
          lib.bcsv_layout_destroy(ctypes.c_void_p(h))
          print("  PASS loaded, created and destroyed a layout")
          PY
            HIGH=$(objdump -T "$LIB" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -V | tail -1)
            echo "  highest glibc symbol version: ${HIGH:-none}"
          elif [[ "${{ runner.os }}" == "Windows" ]]; then
            DUMPBIN="$(cygpath -u "$VCToolsInstallDir" 2>/dev/null)bin/Hostx64/x64/dumpbin.exe"
            [ -x "$DUMPBIN" ] || DUMPBIN=$(find "/c/Program Files/Microsoft Visual Studio" -name dumpbin.exe 2>/dev/null | head -1)
            IMPORTS=$("$DUMPBIN" //DEPENDENTS "$LIB" | grep -oE '^\s+\S+\.dll' | tr -d ' ')
            echo "$IMPORTS" | sed 's/^/  needs /'
            if echo "$IMPORTS" | grep -qiE 'MSVCP|VCRUNTIME|api-ms-win-crt'; then
              echo "  FAIL still needs the Visual C++ Redistributable"; exit 1
            fi
            echo "  PASS no Visual C++ Redistributable needed"
          fi

      - name: Verify the stamped version
        shell: bash
        run: |
          set -e
          # Ask the built binary what version it thinks it is. Checking the
          # artifact rather than the build inputs is the point: this is the
          # step that fails if the toolchain resolved a version other than the
          # one the release intends to ship.
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            PY=/opt/python/cp311-cp311/bin/python   # manylinux ships no system python3
          elif command -v python3 >/dev/null 2>&1; then
            PY=python3
          else
            PY=python                                # Windows runners expose python only
          fi
          ARGS=(--skip-manifests --native "${{ matrix.lib-dir }}/${{ matrix.lib-name }}")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ARGS+=(--tag "${GITHUB_REF#refs/tags/}")
          fi
          "$PY" scripts/check_versions.py "${ARGS[@]}"

      - name: Upload native library
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unity-native-${{ matrix.rid }}
          path: ${{ matrix.lib-dir }}/${{ matrix.lib-name }}
          retention-days: 7

  # ── Run the package's EditMode tests in a real editor ───────────────
  #
  # Opt-in: without a UNITY_LICENSE secret the job reports a notice and does
  # nothing, so a fork or a repository that has not configured Unity CI is not
  # broken by its presence. Configure UNITY_LICENSE (and UNITY_EMAIL /
  # UNITY_PASSWORD for a Personal licence) to turn it on.
  #
  # Until then the same tests are run manually with
  #   scripts/run-unity-tests.sh <path-to-Unity-executable>
  # which stages the native plugin placeholders the editor would otherwise
  # delete. See the comment at the top of that script.
  unity-tests:
    name: Unity EditMode tests
    needs: build-native
    runs-on: ubuntu-latest
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - name: Is a Unity licence configured?
        id: licence
        run: |
          if [ -z "${UNITY_LICENSE:-}" ]; then
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No UNITY_LICENSE secret; skipping the editor run. \
          Run scripts/run-unity-tests.sh locally before releasing."
          else
            echo "have=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        if: steps.licence.outputs.have == 'true'

      - name: Download the linux-x64 native
        if: steps.licence.outputs.have == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unity-native-linux-x64
          path: native-linux-x64

      - name: Assemble a project around the package
        if: steps.licence.outputs.have == 'true'
        run: |
          set -euo pipefail
          # The editor deletes any .meta with no asset beside it, and three of
          # the plugin sidecars describe binaries this job does not download.
          # Placeholders keep them from being tidied away mid-run.
          printf 'placeholder' > unity/Runtime/Plugins/Windows/x86_64/bcsv_c_api.dll
          printf 'placeholder' > unity/Runtime/Plugins/Linux/arm64/libbcsv_c_api.so
          printf 'placeholder' > unity/Runtime/Plugins/macOS/libbcsv_c_api.dylib
          cp native-linux-x64/libbcsv_c_api.so unity/Runtime/Plugins/Linux/x86_64/

          mkdir -p testproj/Packages testproj/Assets testproj/ProjectSettings
          cat > testproj/Packages/manifest.json <<'JSON'
          {
            "dependencies": {
              "com.bcsv.unity": "file:../../unity",
              "com.unity.test-framework": "1.4.5"
            },
            "testables": [ "com.bcsv.unity" ]
          }
          JSON

      - name: EditMode tests
        if: steps.licence.outputs.have == 'true'
        # NOT SHA-pinned, unlike every other action here. Pin it to a
        # verified commit of game-ci/unity-test-runner v4 when this job is
        # first enabled — a hash written without checking it is worse than
        # a tag, because it looks pinned.
        uses: game-ci/unity-test-runner@v4
        with:
          projectPath: testproj
          unityVersion: 6000.0.81f1
          testMode: editmode
          artifactsPath: unity-test-results

      - name: Publish results
        if: steps.licence.outputs.have == 'true' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unity-editmode-results
          path: unity-test-results
          retention-days: 7

  # ── Pack Unity .tgz package ─────────────────────────────────────────
  pack:
    name: Pack .tgz
    needs: build-native
    runs-on: macos-15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Download all native artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: native-artifacts
          pattern: unity-native-*

      - name: Stage native libraries into Plugins structure
        run: |
          cp native-artifacts/unity-native-win-x64/bcsv_c_api.dll \
             unity/Runtime/Plugins/Windows/x86_64/
          cp native-artifacts/unity-native-linux-x64/libbcsv_c_api.so \
             unity/Runtime/Plugins/Linux/x86_64/
          cp native-artifacts/unity-native-linux-arm64/libbcsv_c_api.so \
             unity/Runtime/Plugins/Linux/arm64/
          cp native-artifacts/unity-native-osx-arm64/libbcsv_c_api.dylib \
             unity/Runtime/Plugins/macOS/

          # Remove .gitkeep placeholders
          find unity/Runtime/Plugins -name ".gitkeep" -delete

          echo "=== Staged native libraries ==="
          find unity/Runtime/Plugins -type f

      - name: Resolve version from VERSION.txt
        id: version
        run: |
          # VERSION.txt is the source of truth the natives were built from, so
          # the package must carry the same number rather than re-deriving one
          # from the ref. On a tag build the two are cross-checked and the job
          # fails if they disagree.
          RELEASE_VERSION="$(cat VERSION.txt)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            python3 scripts/check_versions.py --tag "${GITHUB_REF#refs/tags/}"
            VERSION="$RELEASE_VERSION"
          else
            python3 scripts/check_versions.py
            VERSION="${RELEASE_VERSION}-dev.$(date +%Y%m%d%H%M%S)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Package version: $VERSION"

      - name: Patch package.json version
        run: |
          cd unity
          python3 -c "
          import json
          with open('package.json', 'r') as f:
              pkg = json.load(f)
          pkg['version'] = '${{ steps.version.outputs.version }}'
          with open('package.json', 'w') as f:
              json.dump(pkg, f, indent=2)
              f.write('\n')
          print(f'Updated package.json version to: {pkg[\"version\"]}')
          "

      - name: Pack .tgz (UPM format)
        run: |
          # UPM .tgz must contain a top-level "package/" directory.
          # pack-unity.sh selects what ships; check-unity-package.sh refuses to
          # let the job continue if anything staged would import badly.
          ./scripts/pack-unity.sh staging/package
          ./scripts/check-unity-package.sh staging/package

          TARBALL="com.bcsv.unity-${{ steps.version.outputs.version }}.tgz"
          tar -czf "${TARBALL}" -C staging package

          ls -lh "${TARBALL}"
          echo "tarball=${TARBALL}" >> "$GITHUB_OUTPUT"

      - name: Inspect package contents
        run: |
          TARBALL="com.bcsv.unity-${{ steps.version.outputs.version }}.tgz"
          tar -tzf "${TARBALL}" | head -50

      - name: Upload .tgz
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unity-package
          path: com.bcsv.unity-*.tgz
          retention-days: 30

  # ── Attach to GitHub Release ────────────────────────────────────────
  publish:
    name: Attach to Release
    needs: pack
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download .tgz
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unity-package
          path: dist

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/com.bcsv.unity-*.tgz
