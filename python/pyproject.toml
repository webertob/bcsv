[build-system]
requires = [
    "scikit-build-core>=0.10",
    "nanobind>=2.4.0",
    "setuptools-scm>=8.0",
    "numpy>=1.19.0",
]
build-backend = "scikit_build_core.build"

[project]
name = "pybcsv"
authors = [
    {name = "Tobias Weber", email = "weber.tobias.md@gmail.com"},
]
description = "High-performance Python bindings for the BCSV (Binary CSV) library with pandas integration"
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research", 
    "Operating System :: OS Independent",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11", 
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Archiving :: Compression",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
keywords = ["csv", "binary", "data-science", "compression", "performance", "pandas", "numpy", "big-data", "data-processing"]
dependencies = [
    "numpy>=1.19.0",
]
dynamic = ["version"]

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = ["pybcsv"]
# Run the CMake configure step before assembling an sdist. python/CMakeLists.txt
# re-runs sync_headers.py there, so the bundled include/ and src/ copies the
# sdist ships can never lag behind the project headers.
sdist.cmake = true
# Never ship build output inside the source distribution. python/dist/ collects
# locally-built wheels and tarballs, and without this a fresh sdist carried old
# ones along (a 1.5.7 wheel inside a 1.5.16 sdist), for no purpose and at real
# size cost.
sdist.exclude = ["dist", "build", "*.egg-info", ".venv", "venv"]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.setuptools_scm"

[tool.setuptools_scm]
root = ".."
version_file = "pybcsv/_version.py"
tag_regex = "^v(?P<version>[0-9]+\\.[0-9]+\\.[0-9]+)$"
local_scheme = "no-local-version"

[project.scripts]
bcsv2parquet = "pybcsv.parquet_utils:bcsv2parquet_cli"
parquet2bcsv = "pybcsv.parquet_utils:parquet2bcsv_cli"

[project.optional-dependencies]
pandas = ["pandas>=2.0.0"]
arrow = ["pyarrow>=12.0"]
polars = ["polars>=0.20"]
ml = ["torch>=2.0"]
test = ["pytest>=6.0.0", "pytest-cov"]
dev = ["pytest>=6.0.0", "pytest-cov", "black", "flake8"]

[project.urls]
Homepage = "https://github.com/webertob/bcsv"
Documentation = "https://github.com/webertob/bcsv#readme"
Repository = "https://github.com/webertob/bcsv"
"Bug Tracker" = "https://github.com/webertob/bcsv/issues"
"Source Code" = "https://github.com/webertob/bcsv"



[tool.cibuildwheel]
# Explicit allow-list (cibuildwheel builds *everything* it knows otherwise).
# cp314 joined with cibuildwheel 3.1.0 (2025-07). cp314t (free-threaded) is
# deliberately NOT in the list: the extension is not built with nanobind's
# FREE_THREADED marker yet, so CPython 3.14 free-threaded would refuse to
# import it — add "cp314t-*" here together with that marker once the
# bindings are verified thread-safe under the GIL-free runtime.
build = "cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux_* *-win32 *-manylinux_i686 cp314t-*"
test-requires = ["pytest", "pandas", "pyarrow"]
# {package} = the pybcsv package dir inside the container. {project} resolves
# to the copied repo root, whose tests/ are the C++ CLI integration tests:
# without a build tree their conftest skips the whole suite, so the old
# command was vacuously green for every wheel and never imported the
# extension it had just built. This runs the real binding suite per Python.
test-command = "pytest {package}/tests/ -x -q --tb=short"

[tool.cibuildwheel.linux]
before-build = "pip install nanobind numpy"
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"

[tool.cibuildwheel.macos]
before-build = "pip install nanobind numpy"
environment = { MACOSX_DEPLOYMENT_TARGET = "13.3" }

[tool.cibuildwheel.windows]
before-build = "pip install nanobind numpy"

[tool.pytest.ini_options]
testpaths = ["tests"]
